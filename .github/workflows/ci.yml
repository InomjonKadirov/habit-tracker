name: CI

# Every push, no branch filter. VirtuAgent verifies a change by pushing a
# throwaway `virtuagent/ci-verify-<TICKET>` branch and then looking for workflow
# runs whose head commit is that push's sha — the push IS the trigger, and a
# branch filter that failed to match would look exactly like "this repository
# has no CI".
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
